<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THG-Prämie · Beraterapp</title>
<meta name="description" content="Prototyp: THG-Prämie für E-Auto-Kunden abwickeln – Fahrzeugschein scannen, Daten prüfen, Aufklärung, digitale Unterschrift. Jedes Jahr aufs Neue.">
<style>
  :root{
    --gold:#C0A32B;
    --gold-dark:#A98F1F;
    --gold-deep:#8F7A16;
    --gold-soft:#F5EFD8;
    --gold-tint:#FBF8EC;
    --bg:#FAF3F6;
    --card:#FFFFFF;
    --ink:#26262B;
    --ink-soft:#55555E;
    --muted:#8E8E98;
    --line:#E6E1E6;
    --ok:#3E8E5A;
    --ok-soft:#E4F2E9;
    --warn:#B3541E;
    --warn-soft:#FBEADF;
    --blue:#5B7C8D;
    --radius:14px;
    --shadow:0 2px 10px rgba(60,50,10,.08), 0 8px 28px rgba(60,50,10,.07);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
    background:#E9E2E6;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #app{
    max-width:480px;margin:0 auto;min-height:100dvh;background:var(--bg);
    display:flex;flex-direction:column;position:relative;overflow:hidden;
    box-shadow:0 0 40px rgba(0,0,0,.15);
  }
  main{flex:1;display:flex;flex-direction:column;padding-bottom:92px}

  /* ---------- gold hero header with diagonal cut ---------- */
  .hero{
    background:linear-gradient(160deg,#C9AC30,#B79A24);
    color:#fff;
    padding:22px 22px 74px;
    clip-path:polygon(0 0,100% 0,100% calc(100% - 34px),0 100%);
    position:relative;
  }
  .hero .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}
  .hero h1{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.3px}
  .hero p.sub{margin-top:10px;font-size:17px;opacity:.92;font-weight:400;max-width:34ch}
  .avatar{
    width:40px;height:40px;border-radius:50%;background:#5B7C8D;color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;
    border:2px solid rgba(255,255,255,.7);flex:none;
  }
  .bell{position:relative;width:34px;height:34px;color:#fff;opacity:.95}
  .bell .dot{position:absolute;top:-3px;right:-3px;background:#C43B3B;color:#fff;font-size:10px;font-weight:700;
    min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px}

  .pull-up{margin-top:-58px;position:relative;z-index:2;padding:0 16px;display:flex;flex-direction:column;gap:14px}
  .section{padding:0 16px;margin-top:14px;display:flex;flex-direction:column;gap:14px}

  /* ---------- cards ---------- */
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
  .card h3{font-size:16px;font-weight:700;letter-spacing:.02em}
  .card .rule{border-bottom:1.5px solid var(--line);margin:12px 0 0}
  .card-head{display:flex;align-items:center;justify-content:space-between}
  .empty{color:var(--muted);text-align:center;padding:26px 8px 14px;font-size:16px}

  .tile-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px}
  .tile{background:#F4F1F4;border-radius:10px;padding:14px 6px;text-align:center}
  .tile b{display:block;font-size:26px;font-weight:600;color:var(--ink-soft)}
  .tile span{display:block;margin-top:4px;font-size:12.5px;color:var(--muted);line-height:1.25}
  .tile.gold{background:var(--gold-tint)}
  .tile.gold b{color:var(--gold-dark)}

  /* action card like "Neuen Kunden anlegen" */
  .cta-band{
    background:linear-gradient(135deg,#C9AC30,#AE9220);color:#fff;border-radius:var(--radius);
    box-shadow:var(--shadow);padding:16px;display:flex;align-items:center;gap:14px;cursor:pointer;border:none;width:100%;
    text-align:left;
  }
  .cta-band .ico{width:48px;height:48px;border-radius:10px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex:none}
  .cta-band b{font-size:18px;display:block}
  .cta-band span{font-size:14px;opacity:.9;display:block;margin-top:2px}
  .cta-band .chev{margin-left:auto;flex:none}

  /* choice cards (Automatisiert / Manuell style) */
  .choice{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;cursor:pointer;border:2px solid transparent;text-align:left;width:100%}
  .choice.sel{border-color:var(--gold)}
  .choice .ico{width:52px;height:52px;border-radius:10px;background:var(--gold-soft);color:var(--gold-dark);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
  .choice b{font-size:20px;display:block}
  .choice p{color:var(--muted);font-size:15px;margin-top:6px;line-height:1.4}
  .choice .go{display:flex;justify-content:flex-end;margin-top:10px;color:var(--gold-dark);font-weight:700;font-size:16px;gap:6px;align-items:center}

  /* list rows */
  .row{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1.5px solid var(--line);cursor:pointer;background:none;border-left:none;border-right:none;border-top:none;width:100%;text-align:left;font:inherit;color:inherit}
  .row:last-child{border-bottom:none}
  .row .ico{width:42px;height:42px;border-radius:10px;background:var(--gold-soft);color:var(--gold-dark);display:flex;align-items:center;justify-content:center;flex:none;font-weight:700;font-size:15px}
  .row .txt{flex:1;min-width:0}
  .row .txt b{display:block;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .txt span{display:block;font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;flex:none}
  .badge.ok{background:var(--ok-soft);color:var(--ok)}
  .badge.sub{background:var(--gold-soft);color:var(--gold-deep)}
  .badge.due{background:var(--warn-soft);color:var(--warn)}

  /* ---------- wizard ---------- */
  .wiz-top{background:var(--bg);padding:14px 16px 6px;position:sticky;top:0;z-index:5;border-bottom:1px solid rgba(0,0,0,.04);background:#FAF3F6F2;backdrop-filter:blur(6px)}
  .wiz-nav{display:flex;align-items:center;justify-content:space-between;height:40px}
  .wiz-nav .back{display:flex;align-items:center;gap:4px;color:var(--ink);font-size:16px;background:none;border:none;cursor:pointer;font-family:inherit;padding:4px 4px 4px 0}
  .wiz-nav .title{font-weight:700;font-size:17px;position:absolute;left:50%;transform:translateX(-50%);background:inherit;padding:0 6px;pointer-events:none;white-space:nowrap}
  @media (max-width:400px){ .wiz-nav .title{left:auto;right:0;transform:none} }
  .steps{display:flex;align-items:center;margin:14px 2px 10px}
  .step-dot{width:34px;height:34px;border-radius:50%;border:2px solid #D8D2D8;background:#fff;color:var(--muted);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:none;transition:all .25s}
  .step-line{flex:1;height:2.5px;background:#D8D2D8;transition:background .25s}
  .step-dot.active{border-color:var(--gold);background:var(--gold);color:#fff}
  .step-dot.done{border-color:var(--gold);background:var(--gold);color:#fff}
  .step-line.done{background:var(--gold)}
  .wiz-body{padding:8px 16px 20px;display:flex;flex-direction:column;gap:14px;flex:1}
  .stepcount{color:var(--ink-soft);font-size:14.5px;margin-top:4px}
  .wiz-h{font-size:31px;font-weight:700;letter-spacing:-.3px;line-height:1.05}
  .wiz-sub{color:var(--muted);font-size:16.5px;line-height:1.45;margin-top:2px}

  /* footer buttons */
  .wiz-foot{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(250,243,246,0),#FAF3F6 30%);padding:18px 16px calc(16px + env(safe-area-inset-bottom));display:flex;gap:12px;z-index:5}
  .btn{border:none;border-radius:10px;font-family:inherit;font-size:17px;font-weight:700;cursor:pointer;padding:15px 18px;transition:opacity .15s, transform .05s}
  .btn:active{transform:scale(.985)}
  .btn.primary{background:var(--gold);color:#fff;flex:1}
  .btn.primary:disabled{background:#E3D9A8;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--gold-dark);border:2px solid var(--gold);flex:0 0 auto}
  .btn.subtle{background:#F0EBEF;color:var(--ink-soft);flex:0 0 auto}

  /* forms */
  .field{margin-top:14px}
  .field:first-child{margin-top:0}
  .field label{display:block;font-size:15px;color:var(--ink-soft);margin-bottom:7px}
  .field label .code{color:var(--muted);font-size:12.5px;margin-left:4px}
  .field input,.field select{
    width:100%;font-family:inherit;font-size:17px;color:var(--ink);
    background:#fff;border:1.5px solid #D9D3D9;border-radius:8px;padding:13px 14px;outline:none;
  }
  .field input:focus,.field select:focus{border-color:var(--gold)}
  .field input.err{border-color:#C43B3B;background:#FDF4F4}
  .field .hint{font-size:13px;color:var(--muted);margin-top:5px}
  .field .hint.bad{color:#C43B3B}
  .group-h{font-size:17px;font-weight:700;margin:20px 0 2px}
  .group-h:first-child{margin-top:0}

  /* scan */
  .scan-stage{border:2.5px dashed #D2C9A4;border-radius:var(--radius);background:var(--gold-tint);
    min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:22px;text-align:center;position:relative;overflow:hidden}
  .scan-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:11px}
  .scan-stage .ph-ico{color:var(--gold-dark)}
  .scan-stage .ph-t{font-size:16.5px;font-weight:700}
  .scan-stage .ph-s{font-size:14px;color:var(--muted);max-width:30ch}
  .scanline{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#fff,transparent);
    box-shadow:0 0 18px 6px rgba(255,255,240,.85);animation:scan 1.4s ease-in-out infinite;z-index:3}
  @keyframes scan{0%{top:6%}50%{top:92%}100%{top:6%}}
  .scan-veil{position:absolute;inset:0;background:rgba(40,34,6,.35);z-index:2;display:flex;align-items:flex-end;justify-content:center;padding:14px}
  .scan-veil span{color:#fff;font-weight:700;font-size:15px;background:rgba(0,0,0,.45);padding:8px 14px;border-radius:999px}
  .ocr-ok{display:flex;gap:10px;align-items:flex-start;background:var(--ok-soft);border-radius:10px;padding:12px 14px;color:var(--ok);font-size:14.5px;font-weight:600;line-height:1.4}
  .note{display:flex;gap:10px;align-items:flex-start;background:var(--gold-tint);border-radius:10px;padding:12px 14px;color:var(--gold-deep);font-size:14.5px;line-height:1.45}
  .note.warn{background:var(--warn-soft);color:var(--warn);font-weight:600}

  /* aufklärung */
  .aufkl-progress{display:flex;gap:6px;margin-bottom:4px}
  .aufkl-progress i{flex:1;height:5px;border-radius:3px;background:#E2DCE2}
  .aufkl-progress i.done{background:var(--gold)}
  .aufkl-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;min-height:320px}
  .aufkl-card .ico{width:56px;height:56px;border-radius:12px;background:var(--gold-soft);color:var(--gold-dark);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
  .aufkl-card h4{font-size:21px;line-height:1.2}
  .aufkl-card p{color:var(--ink-soft);font-size:16px;line-height:1.55;margin-top:10px;flex:1}
  .confirm-line{display:flex;gap:12px;align-items:flex-start;margin-top:18px;padding-top:16px;border-top:1.5px solid var(--line);cursor:pointer;user-select:none}
  .confirm-line .box{width:26px;height:26px;border-radius:7px;border:2px solid #C9C2C9;background:#fff;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;transition:all .15s;margin-top:1px}
  .confirm-line.on .box{background:var(--gold);border-color:var(--gold)}
  .confirm-line span{font-size:15.5px;font-weight:600;color:var(--ink);line-height:1.4}
  .aufkl-done-list{display:flex;flex-direction:column;gap:8px}
  .aufkl-done-list .item{display:flex;gap:10px;align-items:center;font-size:14.5px;color:var(--ink-soft)}
  .aufkl-done-list .item svg{color:var(--ok);flex:none}

  /* signature */
  .sig-wrap{background:#fff;border:2px dashed #C9C2C9;border-radius:var(--radius);position:relative;overflow:hidden}
  .sig-wrap.signed{border-style:solid;border-color:var(--gold)}
  .sig-wrap canvas{display:block;width:100%;height:220px;touch-action:none}
  .sig-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#C9C2C9;font-size:17px;pointer-events:none}
  .sig-x{position:absolute;left:18px;right:18px;bottom:34px;border-bottom:2px solid #D9D3D9;pointer-events:none}
  .sig-x::before{content:"✕";position:absolute;left:0;bottom:2px;color:#C9C2C9;font-size:14px}
  .sig-tools{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
  .link-btn{background:none;border:none;color:var(--gold-dark);font-weight:700;font-size:15.5px;cursor:pointer;font-family:inherit;padding:6px 0}

  /* summary */
  .kv{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
  .kv:last-child{border-bottom:none}
  .kv .k{color:var(--muted);flex:none}
  .kv .v{font-weight:600;text-align:right;word-break:break-word}
  .money-band{display:flex;gap:10px}
  .money{flex:1;background:var(--gold-tint);border-radius:12px;padding:14px;text-align:center}
  .money b{display:block;font-size:24px;color:var(--gold-deep)}
  .money span{font-size:12.5px;color:var(--muted);display:block;margin-top:3px;line-height:1.3}

  /* success */
  .success-hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:44px 24px 10px}
  .success-hero .ring{width:96px;height:96px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 10px 30px rgba(176,150,30,.4);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
  .success-hero h2{font-size:28px;margin-top:22px}
  .success-hero p{color:var(--muted);font-size:16.5px;line-height:1.5;margin-top:10px}

  /* bottom nav */
  nav.bottom{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
    background:#FCF7FA;border-top:1px solid #EEE7EC;display:flex;align-items:center;justify-content:space-around;
    padding:10px 10px calc(10px + env(safe-area-inset-bottom));z-index:20;
  }
  nav.bottom button{background:none;border:none;cursor:pointer;color:#B9B2B9;padding:8px 20px;border-radius:14px;font-family:inherit}
  nav.bottom button.on{color:var(--gold-dark);background:var(--gold-soft)}
  .fab{
    width:64px;height:64px;background:linear-gradient(150deg,#CDB13A,#A98F1F);border-radius:18px;transform:rotate(45deg);
    display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(150,125,20,.45);
    margin-top:-38px;border:none;cursor:pointer;flex:none;
  }
  .fab svg{transform:rotate(-45deg);color:#fff}

  .footer-brand{display:flex;justify-content:center;padding:26px 16px 10px}
  .footer-brand .plate{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:14px 22px;text-align:center}
  .footer-brand .plate b{color:var(--gold-dark);font-size:15px;display:block;line-height:1.25}
  .footer-brand .plate span{font-size:11.5px;color:var(--muted);font-style:italic;display:block;margin-top:4px}

  .hidden{display:none !important}
  .fade-in{animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="app">
  <main id="main"></main>

  <nav class="bottom" id="bottomNav">
    <button id="nav-home" aria-label="Übersicht" onclick="go('home')">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
    </button>
    <button class="fab" aria-label="Neuer THG-Antrag" onclick="startWizard()">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button id="nav-list" aria-label="Aufträge" onclick="go('list')">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 11h6M9 15h6"/></svg>
    </button>
  </nav>
</div>

<input type="file" id="photoInput" accept="image/*" capture="environment" class="hidden">

<script>
"use strict";
/* =====================================================================
   THG-Prämie – Prototyp für Vermögensberater
   Reines Frontend, Daten in localStorage. OCR wird simuliert.
   ===================================================================== */

const BERATER = { name:"Pablo Meier", vb:"4962100", initial:"P" };
const PRAEMIE_KUNDE = 250;      // € Auszahlung an den Kunden
const VERGUETUNG_BERATER = 30;  // € Vermittlungsvergütung je Abschluss
const JAHR = new Date().getFullYear();

const AUFKLAERUNG = [
  { key:"bev", titel:"Reines Elektrofahrzeug",
    text:"Das Fahrzeug ist ein reines Batterie-Elektrofahrzeug (Antriebsart „Elektro“ laut Feld P.3 der Zulassungsbescheinigung). Hybrid- und Plug-in-Hybrid-Fahrzeuge sind für die THG-Prämie nicht berechtigt.",
    confirm:"Der Kunde bestätigt, dass es sich um ein reines Elektrofahrzeug handelt.",
    icon:"car" },
  { key:"halter", titel:"Halter laut Fahrzeugschein",
    text:"Nur der in der Zulassungsbescheinigung Teil I eingetragene Halter darf die THG-Quote verkaufen. Der Kunde ist als Halter des Fahrzeugs eingetragen.",
    confirm:"Der Kunde bestätigt, dass er der eingetragene Halter ist.",
    icon:"id" },
  { key:"einmal", titel:"Quote noch nicht vergeben",
    text:"Die THG-Quote kann je Fahrzeug nur einmal pro Kalenderjahr vermarktet werden. Der Kunde hat die Quote für das Jahr " + JAHR + " noch keinem anderen Anbieter übertragen.",
    confirm:"Der Kunde bestätigt, dass die Quote " + JAHR + " noch nicht vergeben wurde.",
    icon:"repeat" },
  { key:"widerruf", titel:"Widerrufsrecht – 14 Tage",
    text:"Der Kunde kann den Auftrag innerhalb von 14 Tagen nach Abschluss ohne Angabe von Gründen in Textform (z. B. E-Mail) widerrufen. Die Widerrufsbelehrung wird ihm mit der Auftragsbestätigung zugesandt.",
    confirm:"Der Kunde wurde über das 14-tägige Widerrufsrecht belehrt.",
    icon:"undo" },
  { key:"auszahlung", titel:"Auszahlungszeitpunkt",
    text:"Die Prämie in Höhe von " + PRAEMIE_KUNDE + " € wird ausgezahlt, nachdem das Umweltbundesamt die Quote bestätigt hat – in der Regel 10 bis 16 Wochen nach Einreichung. Die Auszahlung erfolgt auf die angegebene IBAN.",
    confirm:"Der Kunde wurde über den Auszahlungszeitpunkt informiert.",
    icon:"euro" },
  { key:"agb", titel:"AGB & Datenschutz",
    text:"Der Kunde hat die Allgemeinen Geschäftsbedingungen und die Datenschutzerklärung zur Kenntnis genommen. Er willigt in die Verarbeitung seiner Daten und die Weitergabe der Fahrzeugdaten an das Umweltbundesamt zur Abwicklung der THG-Quote ein.",
    confirm:"Der Kunde akzeptiert AGB und Datenschutzerklärung.",
    icon:"shield" },
];

/* Beispieldatensätze für die simulierte Texterkennung */
const OCR_DEMOS = [
  { halterVorname:"Sabine", halterName:"Krause", strasse:"Lindenweg 12", plzOrt:"64289 Darmstadt",
    kennzeichen:"DA-SK 447 E", marke:"VW", modell:"ID.3 Pro", fin:"WVWZZZE1ZMP012347",
    erstzulassung:"2023-04-14", klasse:"M1", antrieb:"Elektro" },
  { halterVorname:"Murat", halterName:"Öztürk", strasse:"Am Riedgraben 3", plzOrt:"60486 Frankfurt am Main",
    kennzeichen:"F-MO 812 E", marke:"Tesla", modell:"Model 3", fin:"5YJ3E7EB1KF312988",
    erstzulassung:"2022-09-02", klasse:"M1", antrieb:"Elektro" },
  { halterVorname:"Anja", halterName:"Behrens", strasse:"Kastanienallee 58", plzOrt:"28203 Bremen",
    kennzeichen:"HB-AB 66 E", marke:"Renault", modell:"Zoe R135", fin:"VF1AG000X64559812",
    erstzulassung:"2021-11-20", klasse:"M1", antrieb:"Elektro" },
];

/* ---------------- Storage ---------------- */
const LS_KEY = "thg.antraege.v1";
function loadAll(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)) || []; }catch(e){ return []; } }
function saveAll(a){ localStorage.setItem(LS_KEY, JSON.stringify(a)); }
function seed(){
  if(localStorage.getItem("thg.seeded")) return;
  const d = OCR_DEMOS[2];

/* ---------------- Utils ---------------- */
const $ = s => document.querySelector(s);
const main = () => $("#main");
function esc(s){ return String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDate(iso){ if(!iso) return "–"; const d=new Date(iso); return d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"}); }
function fmtEuro(n){ return n.toLocaleString("de-DE") + " €"; }
function statusLabel(s){ return {eingereicht:"Eingereicht", pruefung:"In Prüfung", ausgezahlt:"Ausgezahlt"}[s] || s; }
function statusBadge(s){ return s==="ausgezahlt" ? "ok" : "sub"; }

function formatIban(v){
  return v.replace(/[^a-zA-Z0-9]/g,"").toUpperCase().replace(/(.{4})/g,"$1 ").trim();
}
function ibanValid(v){
  const s = v.replace(/\s/g,"").toUpperCase();
  if(!/^[A-Z]{2}\d{2}[A-Z0-9]{11,30}$/.test(s)) return false;
  if(s.startsWith("DE") && s.length !== 22) return false;
  const rearr = s.slice(4)+s.slice(0,4);
  let rem = 0;
  for(const ch of rearr){
    const code = ch >= "0" && ch <= "9" ? ch : (ch.charCodeAt(0)-55).toString();
    for(const d of code){ rem = (rem*10 + (+d)) % 97; }
  }
  return rem === 1;
}

  window.scrollTo(0,0);
}

function pickPhoto(){ $("#photoInput").click(); }
document.addEventListener("DOMContentLoaded", ()=>{
  $("#photoInput").addEventListener("change", e=>{
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if(!f) return;
    const img = new Image();
    img.onload = ()=>{
      const c = document.createElement("canvas");
      const sc = Math.min(1, 900/img.width);
      c.width = img.width*sc; c.height = img.height*sc;
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      simulateScan(c.toDataURL("image/jpeg",.8));
      URL.revokeObjectURL(img.src);
    };
    img.src = URL.createObjectURL(f);
  });
});
function simulateScan(dataUrl){
  wiz.foto = dataUrl; wiz.scanning = true; renderWizard();
  setTimeout(()=>{
    const demo = OCR_DEMOS[Math.floor(Math.random()*OCR_DEMOS.length)];
    wiz.daten = {...demo};
    wiz.scanning = false; wiz.scanned = true;
    renderWizard();
  }, 2100);
}

/* ---- Schritt 2: Daten prüfen ---- */
function stepDaten(){
  const d = wiz.daten;
  const notBev = d.antrieb !== "Elektro";
  const inp = (id,label,val,code,ph)=>`
    <div class="field"><label for="f-${id}">${label}${code?`<span class="code">Feld ${code}</span>`:""}</label>
    <input id="f-${id}" value="${esc(val)}" placeholder="${ph||"Bitte eingeben"}" oninput="wiz.daten.${id}=this.value"></div>`;
  return `
  <div class="wiz-body fade-in">
    <div>
      <div class="stepcount">Schritt 2 von 5</div>
      <div class="wiz-h">Daten prüfen</div>
      <p class="wiz-sub">${wiz.renewalOf?"Aus dem Vorjahr übernommen – bitte auf Aktualität prüfen.":"Automatisch ausgelesen – bitte prüfen und bei Bedarf korrigieren."}</p>
    </div>
    <div class="card">
      <div class="group-h">Halter</div>
      ${inp("halterVorname","Vorname",d.halterVorname,"C.1.2")}
      ${inp("halterName","Name",d.halterName,"C.1.1")}
      ${inp("strasse","Straße und Hausnummer",d.strasse,"C.1.3")}
      ${inp("plzOrt","PLZ und Ort",d.plzOrt,"")}
      <div class="group-h">Fahrzeug</div>
      ${inp("kennzeichen","Kennzeichen",d.kennzeichen,"A")}
      ${inp("marke","Marke",d.marke,"D.1")}
      ${inp("modell","Handelsbezeichnung",d.modell,"D.3")}
      ${inp("fin","Fahrzeug-Identifizierungsnummer",d.fin,"E")}
      <div class="field"><label for="f-ez">Erstzulassung<span class="code">Feld B</span></label>
        <input id="f-ez" type="date" value="${esc(d.erstzulassung)}" oninput="wiz.daten.erstzulassung=this.value"></div>
      <div class="field"><label for="f-antrieb">Antriebsart<span class="code">Feld P.3</span></label>
        <select id="f-antrieb" onchange="wiz.daten.antrieb=this.value;renderWizard()">
          ${["Elektro","Hybrid","Benzin","Diesel"].map(o=>`<option ${o===d.antrieb?"selected":""}>${o}</option>`).join("")}
        </select>
        ${notBev?`<div class="hint bad">Nur reine Elektrofahrzeuge sind für die THG-Prämie berechtigt.</div>`:""}
      </div>
    </div>
    ${notBev?`<div class="note warn"><span style="flex:none">${IC.info}</span>
      <span>Dieses Fahrzeug ist kein reines Elektrofahrzeug. Ein THG-Antrag ist nicht möglich.</span></div>`:""}
  </div>
  <div class="wiz-foot">
    <button class="btn ghost" onclick="wiz.step=1;renderWizard()">Zurück</button>
    <button class="btn primary" ${notBev?"disabled":""} onclick="validateDaten()">Weiter</button>
  </div>`;
}
function validateDaten(){
  const d = wiz.daten;
  const missing = ["halterVorname","halterName","kennzeichen","fin"].filter(k=>!String(d[k]||"").trim());
  if(missing.length){
    alert("Bitte füllen Sie mindestens Vorname, Name, Kennzeichen und FIN aus.");
    return;
  }
  wiz.step = 3; renderWizard();
}

/* ---- Schritt 3: IBAN ---- */
function stepIban(){
  const v = wiz.iban;
  const valid = ibanValid(v);
  return `
  <div class="wiz-body fade-in">
    <div>
      <div class="stepcount">Schritt 3 von 5</div>
      <div class="wiz-h">Bankverbindung</div>
      <p class="wiz-sub">Auf dieses Konto zahlen wir die Prämie von ${fmtEuro(PRAEMIE_KUNDE)} aus.</p>
    </div>
    <div class="card">
      <div class="field">
        <label for="f-iban">IBAN des Kunden</label>
        <input id="f-iban" inputmode="text" autocomplete="off" spellcheck="false"
          placeholder="DE00 0000 0000 0000 0000 00"
          value="${esc(formatIban(v))}" class="${v && !valid?"err":""}"
          oninput="onIban(this)">
        <div class="hint ${v && !valid?"bad":""}" id="iban-hint">
          ${!v ? "Kontoinhaber muss der Fahrzeughalter sein." : valid ? "IBAN geprüft ✓" : "IBAN unvollständig oder ungültig."}
        </div>
      </div>
    </div>
    <button class="choice" onclick="useDemoIban()" style="display:flex;align-items:center;gap:14px;padding:14px 16px">
      <span class="ico" style="margin:0;width:44px;height:44px">${IC.bolt}</span>
      <span style="flex:1"><b style="font-size:16.5px">Demo-IBAN verwenden</b>
      <p style="margin-top:2px;font-size:13.5px">Gültige Muster-IBAN für die Präsentation einsetzen</p></span>
      ${IC.chevR}
    </button>
    <div class="note"><span style="flex:none">${IC.info}</span>
      <span>Die Auszahlung erfolgt nach Bestätigung der Quote durch das Umweltbundesamt, in der Regel 10–16 Wochen nach Einreichung.</span></div>
  </div>
  <div class="wiz-foot">
    <button class="btn ghost" onclick="wiz.step=2;renderWizard()">Zurück</button>
    <button class="btn primary" id="iban-next" ${valid?"":"disabled"} onclick="wiz.step=4;wiz.aufklIndex=0;wiz.aufklChecked=false;wiz.aufklDone=[];renderWizard()">Weiter</button>
  </div>`;
}
function useDemoIban(){
  wiz.iban = "DE02120300000000202051";
  renderWizard();
}
function onIban(el){
  const pos = el.selectionStart;
  wiz.iban = el.value;
  const f = formatIban(el.value);
  el.value = f;
  try{ el.setSelectionRange(f.length, f.length); }catch(e){}
  const valid = ibanValid(f);
  el.classList.toggle("err", !!f && !valid);
  $("#iban-hint").textContent = !f ? "Kontoinhaber muss der Fahrzeughalter sein."
    : valid ? "IBAN geprüft ✓" : "IBAN unvollständig oder ungültig.";
  $("#iban-hint").classList.toggle("bad", !!f && !valid);
  $("#iban-next").disabled = !valid;
}

/* ---- Schritt 4: Aufklärung (Durchklickprinzip) ---- */
function stepAufklaerung(){
  const i = wiz.aufklIndex;
  const p = AUFKLAERUNG[i];
  return `
  <div class="wiz-body fade-in">
    <div>
      <div class="stepcount">Schritt 4 von 5 · Punkt ${i+1} von ${AUFKLAERUNG.length}</div>
      <div class="wiz-h">Aufklärung</div>
      <p class="wiz-sub">Gehen Sie die Punkte gemeinsam mit dem Kunden durch.</p>
    </div>
    <div class="aufkl-progress">${AUFKLAERUNG.map((_,k)=>`<i class="${k<i||(k===i&&wiz.aufklChecked)?"done":""}"></i>`).join("")}</div>
    <div class="aufkl-card fade-in" key="${i}">
      <span class="ico">${IC[p.icon]}</span>
      <h4>${esc(p.titel)}</h4>
      <p>${esc(p.text)}</p>
      <div class="confirm-line ${wiz.aufklChecked?"on":""}" onclick="wiz.aufklChecked=!wiz.aufklChecked;renderWizard()">
        <span class="box">${IC.check}</span>
        <span>${esc(p.confirm)}</span>
      </div>
    </div>
  </div>
  <div class="wiz-foot">
    <button class="btn ghost" onclick="aufklBack()">Zurück</button>
    <button class="btn primary" ${wiz.aufklChecked?"":"disabled"} onclick="aufklNext()">
      ${i < AUFKLAERUNG.length-1 ? "Bestätigen & weiter" : "Alle Punkte bestätigt"}
    </button>
  </div>`;
}
function aufklNext(){
  wiz.aufklDone[wiz.aufklIndex] = new Date().toISOString();
  if(wiz.aufklIndex < AUFKLAERUNG.length-1){
    wiz.aufklIndex++; wiz.aufklChecked = false;
  } else {
    wiz.step = 5;
  }
  renderWizard();
}
function aufklBack(){
  if(wiz.aufklIndex > 0){ wiz.aufklIndex--; wiz.aufklChecked = true; renderWizard(); }
  else { wiz.step = 3; renderWizard(); }
}

/* ---- Schritt 5: Unterschrift ---- */
function stepSignatur(){
  const d = wiz.daten;
  window.__afterRender = initSignature;
  return `
  <div class="wiz-body fade-in">
    <div>
      <div class="stepcount">Schritt 5 von 5</div>
      <div class="wiz-h">Unterschrift</div>
      <p class="wiz-sub">${esc(d.halterVorname)} ${esc(d.halterName)} unterschreibt direkt auf dem Gerät.</p>
    </div>

    <div class="card" style="padding:14px 18px">
      <div class="kv"><span class="k">Fahrzeug</span><span class="v">${esc(d.marke)} ${esc(d.modell)} · ${esc(d.kennzeichen)}</span></div>
      <div class="kv"><span class="k">Prämie ${JAHR}</span><span class="v">${fmtEuro(PRAEMIE_KUNDE)}</span></div>
      <div class="kv"><span class="k">Aufklärung</span><span class="v" style="color:var(--ok)">${AUFKLAERUNG.length} von ${AUFKLAERUNG.length} bestätigt ✓</span></div>
    </div>

    <div>
      <div class="sig-wrap" id="sigWrap">
        <canvas id="sigCanvas"></canvas>
        <div class="sig-hint" id="sigHint">Hier unterschreiben</div>
        <div class="sig-x"></div>
      </div>
      <div class="sig-tools">
        <button class="link-btn" onclick="clearSignature()">Löschen</button>
        <button class="link-btn" onclick="demoSignature()">Demo-Unterschrift</button>
        <span style="font-size:13px;color:var(--muted)">Unterschrift des Halters</span>
      </div>
    </div>

    <div class="note"><span style="flex:none">${IC.info}</span>
      <span>Mit der Unterschrift beauftragt der Kunde die Vermarktung seiner THG-Quote für das Jahr ${JAHR} und bestätigt die Aufklärungspunkte.</span></div>
  </div>
  <div class="wiz-foot">
    <button class="btn ghost" onclick="wiz.step=4;wiz.aufklIndex=AUFKLAERUNG.length-1;wiz.aufklChecked=true;renderWizard()">Zurück</button>
    <button class="btn primary" id="finishBtn" disabled onclick="finishWizard()">Auftrag abschließen</button>
  </div>`;
}

let sig = null;
function initSignature(){
  const canvas = $("#sigCanvas");
  if(!canvas) return;
  const ratio = window.devicePixelRatio || 1;
  const w = canvas.offsetWidth, h = 220;
  canvas.width = w*ratio; canvas.height = h*ratio;
  const ctx = canvas.getContext("2d");
  ctx.scale(ratio,ratio);
  ctx.lineWidth = 2.4; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#1D2A66";
  sig = { ctx, drawing:false, empty:true, last:null };

  const pos = e => {
    const r = canvas.getBoundingClientRect();
    return { x:e.clientX-r.left, y:e.clientY-r.top };
  };
  canvas.addEventListener("pointerdown", e=>{
    e.preventDefault(); canvas.setPointerCapture(e.pointerId);
    sig.drawing = true; sig.last = pos(e);
  });
  canvas.addEventListener("pointermove", e=>{
    if(!sig.drawing) return;
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(sig.last.x, sig.last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    sig.last = p;
    if(sig.empty){
      sig.empty = false;
      $("#sigHint").style.display = "none";
      $("#sigWrap").classList.add("signed");
      $("#finishBtn").disabled = false;
    }
  });
  const up = ()=>{ sig.drawing = false; };
  canvas.addEventListener("pointerup", up);
  canvas.addEventListener("pointercancel", up);
}
function demoSignature(){
  const canvas = $("#sigCanvas");
  if(!canvas || !sig) return;
  clearSignature();
  const ctx = sig.ctx;
  const w = canvas.offsetWidth, base = 150;
  /* geschwungener Muster-Schriftzug des Demo-Halters */
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(w*0.12, base);
  ctx.bezierCurveTo(w*0.16, base-70, w*0.24, base-78, w*0.24, base-30);
  ctx.bezierCurveTo(w*0.24, base+8,  w*0.16, base+6,  w*0.20, base-14);
  ctx.bezierCurveTo(w*0.26, base-44, w*0.34, base-40, w*0.38, base-18);
  ctx.bezierCurveTo(w*0.42, base+2,  w*0.48, base-4,  w*0.50, base-22);
  ctx.bezierCurveTo(w*0.52, base-38, w*0.58, base-36, w*0.60, base-16);
  ctx.bezierCurveTo(w*0.63, base+6,  w*0.70, base-60, w*0.74, base-26);
  ctx.bezierCurveTo(w*0.77, base-2,  w*0.84, base-10, w*0.88, base-20);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(w*0.30, base+16);
  ctx.quadraticCurveTo(w*0.55, base+30, w*0.80, base+12);
  ctx.stroke();
  ctx.restore();
  sig.empty = false;
  $("#sigHint").style.display = "none";
  $("#sigWrap").classList.add("signed");
  $("#finishBtn").disabled = false;
}
function clearSignature(){
  const canvas = $("#sigCanvas");
  if(!canvas || !sig) return;
  sig.ctx.clearRect(0,0,canvas.width,canvas.height);
  sig.empty = true;
  $("#sigHint").style.display = "";
  $("#sigWrap").classList.remove("signed");
  $("#finishBtn").disabled = true;
}

function finishWizard(){
  if(!sig || sig.empty) return;
  const canvas = $("#sigCanvas");
  const d = wiz.daten;
  const rec = {
    id: "a" + Date.now().toString(36),
    jahr: JAHR,
    status: "eingereicht",
    datum: new Date().toISOString(),
    ...d,
    iban: wiz.iban.replace(/\s/g,"").toUpperCase(),
    praemie: PRAEMIE_KUNDE,
    verguetung: VERGUETUNG_BERATER,
    aufklaerung: AUFKLAERUNG.map((a,i)=>({key:a.key, titel:a.titel, bestaetigt:wiz.aufklDone[i]||new Date().toISOString()})),
    signatur: canvas.toDataURL("image/png"),
    foto: wiz.foto,
    renewalOf: wiz.renewalOf,
  };
  const all = loadAll(); all.push(rec); saveAll(all);
  go("success", rec.id);
}
